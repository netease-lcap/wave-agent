name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for creating GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm -r publish --no-git-checks --provenance --access public

      # --- VS Code extension (.vsix) ---
      - name: Package .vsix
        run: pnpm -F wave-vscode run package

      # --- VS Code Marketplace (Entra ID, no PAT) ---
      # PATs retire 2026-12-01; publish via Azure OIDC federated credentials
      # instead: azure/login@v2 exchanges the Actions id-token (federated
      # credential Subject: repo:netease-lcap/wave-agent:ref:refs/tags/v*),
      # and `vsce publish --azure-credential` reuses the resulting az login
      # cache — no PAT secret involved.
      # Only runs on tag pushes; workflow_dispatch (asset re-upload) must not
      # re-publish because the marketplace rejects duplicate versions.
      - name: Azure login
        if: startsWith(github.ref, 'refs/tags/')
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm -F wave-vscode exec vsce publish --azure-credential --packagePath releases/*.vsix

      # --- Docs (docs-<version>.tar.gz) ---
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm -F wave-webview exec playwright install --with-deps chromium

      - name: Generate screenshots
        run: pnpm -F wave-webview run test:demo

      - name: Build docs with base /docs/
        run: npx vitepress build docs --base /docs/

      # Version the archive like the other release assets (.vsix/.zip/.dmg/.exe);
      # read from package.json (bumped by scripts/version.js) so it also works
      # on workflow_dispatch, where GITHUB_REF_NAME is a branch, not a tag.
      - name: Package docs archive
        run: |
          VERSION=$(node -p "require('./package.json').version")
          tar -czf "docs-${VERSION}.tar.gz" -C docs/.vitepress/dist .

      # --- GitHub Release ---
      - name: Get previous tag
        id: prev-tag
        run: |
          PREV_TAG=$(git tag --sort=-v:refname --list 'v*' | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          echo "tag=${PREV_TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            packages/vscode/releases/*.vsix
            docs-*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          previous_tag: ${{ steps.prev-tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- JetBrains plugin (.zip) ---
  # Builds the JB plugin distribution and attaches it to the same GitHub Release.
  # Runs in parallel with `publish`; action-gh-release is idempotent (create-or-update)
  # and merges assets, so both jobs targeting the same tag's release is safe. Only
  # `publish` generates release notes / sets the body — this job adds the .zip asset
  # and mirrors the prerelease flag in case it creates the release first.
  build-jetbrains:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # The webview bundles from wave-agent-sdk/dist (see imports like
      # 'wave-agent-sdk/dist/types/...'), so build the SDK dist first.
      - name: Build agent-sdk dist
        run: pnpm -F wave-agent-sdk build

      # copyWebviewAssets (build.gradle.kts) copies chat.js/chat.css from
      # packages/webview/dist into the plugin resources, so build the webview next.
      # Use `compile -- --production` (not `build`) so the bundle is minified and
      # source maps are omitted — `build` would also trigger postbuild syncTargets,
      # which is unnecessary here and ships the unminified dev bundle (~9.4MB vs
      # ~3.6MB), bloating the .zip.
      - name: Build webview dist
        run: pnpm -F wave-webview run compile -- --production

      - name: Run Gradle tests
        run: ./packages/jetbrains/gradlew -p packages/jetbrains test --no-daemon

      - name: Build plugin distribution (.zip)
        run: ./packages/jetbrains/gradlew -p packages/jetbrains buildPlugin --no-daemon

      - name: Attach .zip to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: packages/jetbrains/build/distributions/*.zip
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- JetBrains Marketplace ---
      # publishPlugin uploads the distribution built above (plugin id
      # com.wave.jetbrains read from plugin.xml). JetBrains has no OIDC
      # equivalent, so this needs a permanent marketplace token.
      # Same duplicate-version guard as the VS Code step: tag pushes only.
      - name: Publish to JetBrains Marketplace
        if: startsWith(github.ref, 'refs/tags/')
        run: ./packages/jetbrains/gradlew -p packages/jetbrains publishPlugin --no-daemon -PintellijPublishToken=${{ secrets.JETBRAINS_TOKEN }}

  # --- Desktop app (Electron) ---
  # Builds the desktop installers and attaches them to the same GitHub Release
  # (FR-021). macOS .dmg requires a macOS runner and Windows NSIS a Windows
  # runner, hence the matrix. macOS builds are Developer ID-signed and notarized
  # via CSC_LINK/CSC_KEY_PASSWORD (p12) + App Store Connect API key secrets;
  # Windows builds remain unsigned (no code-signing cert configured).
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # The webview bundles from wave-agent-sdk/dist (see imports like
      # 'wave-agent-sdk/dist/types/...'), so build the SDK dist first.
      - name: Build agent-sdk dist
        run: pnpm -F wave-agent-sdk build

      # Use `compile -- --production` (not `build`) so the webview bundle is
      # minified — the desktop app's syncWebview step copies dist verbatim.
      - name: Build webview dist
        run: pnpm -F wave-webview run compile -- --production

      # `--publish never`: electron-builder only produces the installers; the
      # release upload is handled by action-gh-release below. Apple signing +
      # notarization env vars are injected only on macOS (the p12 and App Store
      # Connect API key are Apple-specific; passing them to the Windows runner
      # would make electron-builder attempt an invalid signature there).
      #
      # APPLE_API_KEY must be a PATH to the .p8 file: @electron/notarize
      # forwards it verbatim as `notarytool --key <value>` (no base64 decode
      # or temp-file write on our installed 2.5.0), so the raw PEM content
      # would be parsed as an option (starts with '-') → "Invalid option".
      # Materialize the secret into a runner-local file first.
      - name: Build desktop installers (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          APPLE_API_KEY="$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8" pnpm -F wave-desktop run dist -- --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build desktop installers (Windows)
        if: runner.os == 'Windows'
        run: pnpm -F wave-desktop run dist -- --publish never

      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.exe
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
