name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # PR gate: every test of the three heaviest packages (agent-sdk, code,
    # webview) — one `test` per package, no unit/integration split — each
    # sharded in two halves via vitest --shard and run on separate runners in
    # parallel. agent-sdk's `test` includes `tests/integration/**` and its
    # `*.integration.test.ts`, which used to be a separate `integration` job.
    if: github.event_name != 'push'

    strategy:
      fail-fast: false
      matrix:
        pkg: [agent-sdk, code, webview]
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!scripts/**'
              - '!packages/webview/e2e/**'
              - '!packages/webview/demo/**'
              - '!LICENSE'

      # Cache pnpm/action-setup's install dir so concurrent jobs skip
      # re-downloading the action tarball from codeload (429 rate limits,
      # pnpm/action-setup#177). On hit we skip the action and prepend its bin
      # dirs to PATH ourselves. The key pins the pnpm version — keep it in
      # sync with the `version` input below (package.json "packageManager").
      - name: Cache pnpm install
        if: steps.filter.outputs.code == 'true'
        id: pnpm-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/setup-pnpm
          key: pnpm-setup-v5-${{ runner.os }}-${{ runner.arch }}-12.18.0

      - name: Add cached pnpm to PATH
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          # Mirror pnpm/action-setup's env: node_modules/.bin/bin holds the
          # self-updated target version (higher precedence), node_modules/.bin
          # the bootstrap symlink. GITHUB_PATH is used verbatim, so write
          # native Windows paths on Windows runners.
          PNPM_HOME="${USERPROFILE:-$HOME}/.cache/setup-pnpm/node_modules/.bin"
          PNPM_BIN="$PNPM_HOME/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PNPM_HOME="${PNPM_HOME//\//\\}"
            PNPM_BIN="${PNPM_BIN//\//\\}"
          fi
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"

      - name: Setup pnpm (cache miss)
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 12.18.0
          dest: ~/.cache/setup-pnpm
          run_install: false

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: pnpm build

      # Downloading Chromium is the biggest source of variance in this job, and
      # each of the two shards pays it. Restoring only works if this key matches
      # one a **default-branch** job saved: GitHub scopes a cache created by a
      # PR run to that PR's merge ref, readable only by its own re-runs (never
      # by the base branch or a sibling PR). So the key mirrors `pages.yml` —
      # the only job that runs on `main` — and `restore-keys` absorbs lock-file
      # churn, since `playwright install` repairs a prefix match (browsers live
      # in version-named subdirectories).
      - name: Cache Playwright browsers
        if: steps.filter.outputs.code == 'true' && matrix.pkg == 'webview'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      # wave-webview's unit suite runs in a real Chromium (vitest browser
      # mode): jsdom does no layout, and the components under test measure
      # their own geometry. Only that matrix leg needs the browser.
      #
      # `--with-deps` runs every time, on a cache hit too — and not because the
      # runner might be missing a shared library. It installs Chromium's apt
      # dependency list, which includes `fonts-wqy-zenhei`, `fonts-unifont` and
      # `fonts-ipafont-gothic`: **the only CJK fonts this environment ever has**.
      # Skipping it on a hit (tried, to save 19s) leaves Chinese text with no
      # fallback, so line boxes come out ~85px off `estimateRowHeight` and the
      # virtual-scroll geometry assertions in `e2e/virtual-scroll-drift` fail
      # deterministically — a fake red that no real user can hit. The 19s is the
      # price of the environment, not waste.
      - name: Install Playwright Chromium (webview tests)
        if: steps.filter.outputs.code == 'true' && matrix.pkg == 'webview'
        run: pnpm -F wave-webview exec playwright install --with-deps chromium

      - name: Tests (shard ${{ matrix.shard }}/2)
        if: steps.filter.outputs.code == 'true'
        run: pnpm -F wave-${{ matrix.pkg }} test --shard=${{ matrix.shard }}/2

  check-extras:
    runs-on: ubuntu-latest
    # PR gate, runs in parallel with check: type-check + lint (platform
    # agnostic, run once for all packages here) and the two small packages'
    # tests, which are fast enough to stay unsharded.
    #
    # `wave-desktop test` runs BOTH of its vitest projects: the mocked
    # unit layer and the real-host layer (real DesktopHost driving a real
    # `wave --stdio` child process, local model server instead of an LLM, no
    # display — the Electron shell is stubbed). The real-host suite used to be
    # its own `real-host-e2e` job; it moved here because both layers share the
    # same `pnpm build` and the machine, so one job covers them without adding
    # a runner to the critical path.
    if: github.event_name != 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!scripts/**'
              - '!packages/webview/e2e/**'
              - '!packages/webview/demo/**'
              - '!LICENSE'

      # Cache pnpm/action-setup's install dir so concurrent jobs skip
      # re-downloading the action tarball from codeload (429 rate limits,
      # pnpm/action-setup#177). On hit we skip the action and prepend its bin
      # dirs to PATH ourselves. The key pins the pnpm version — keep it in
      # sync with the `version` input below (package.json "packageManager").
      - name: Cache pnpm install
        if: steps.filter.outputs.code == 'true'
        id: pnpm-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/setup-pnpm
          key: pnpm-setup-v5-${{ runner.os }}-${{ runner.arch }}-12.18.0

      - name: Add cached pnpm to PATH
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          # Mirror pnpm/action-setup's env: node_modules/.bin/bin holds the
          # self-updated target version (higher precedence), node_modules/.bin
          # the bootstrap symlink. GITHUB_PATH is used verbatim, so write
          # native Windows paths on Windows runners.
          PNPM_HOME="${USERPROFILE:-$HOME}/.cache/setup-pnpm/node_modules/.bin"
          PNPM_BIN="$PNPM_HOME/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PNPM_HOME="${PNPM_HOME//\//\\}"
            PNPM_BIN="${PNPM_BIN//\//\\}"
          fi
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"

      - name: Setup pnpm (cache miss)
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 12.18.0
          dest: ~/.cache/setup-pnpm
          run_install: false

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: pnpm build

      - name: Type-check, lint, small package tests
        if: steps.filter.outputs.code == 'true'
        run: |
          # 必须串行：多个 tsrs 进程同时构建 program 时，模块解析会偶发漏掉包
          # （幻影 TS2307）。根脚本 type-check 已带 --workspace-concurrency=1，
          # 这里不要再加 --parallel。
          pnpm run type-check
          pnpm -r --parallel lint
          pnpm -F wave-desktop -F wave-vscode -F wave-webview-fixtures test

  webview-command-audit:
    runs-on: ubuntu-latest
    # PR gate: 静态审计 webview→host 消息契约（scripts/audit-webview-commands.mjs）。
    # 新 webview 发送命令若在 4 个路由实例（vscode chat/settings、desktop、
    # jetbrains）任一漏注册即红（#2086/#2087/JB backgroundCurrentTask 类 bug）；
    # host 侧新增 webview 永不发送的 case 若未登记脚本 legacy 豁免清单也红。
    # 纯 Node 无依赖、无 pnpm 安装，秒级完成——独立 job 而非并入 check-extras，
    # 避免被 code filter 的 '!scripts/**' 排除（脚本自身改动也要触发）。
    if: github.event_name != 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            contract:
              - 'packages/webview/src/**'
              - 'packages/vscode/src/session/messageHandler.ts'
              - 'packages/desktop/src/main/desktopHost.ts'
              - 'packages/jetbrains/src/main/kotlin/com/wave/jetbrains/session/MessageHandler.kt'
              - 'scripts/audit-webview-commands.mjs'
              - '.github/workflows/ci.yml'

      - name: Setup Node.js
        if: steps.filter.outputs.contract == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Audit webview→host command contract
        if: steps.filter.outputs.contract == 'true'
        run: node scripts/audit-webview-commands.mjs

  sdk-surface:
    runs-on: ubuntu-latest
    # PR gate：SDK 公共面 / 宿主边界自检（scripts/check-sdk-surface.mjs）。四项：
    #   ① 宿主包只能从允许的 SDK 子路径导入（desktop/vscode → `/host`，webview →
    #      `/types` + `/constants`；桶入口与 `dist/...` 深路径都算违规）；
    #   ② `/host` 入口的依赖闭包必须零第三方依赖且在体积预算内；
    #   ③ 把 `@vscode/*` 从解析环境里去掉后每个 SDK 入口仍能加载（可选平台包只许
    #      惰性解析——v1.2.5 崩的就是顶层 re-export）；
    #   ④ `sideEffects: false` 在位。
    # 只看依赖与入口的形状，秒级、不构建宿主产物，所以放 PR 档。
    if: github.event_name != 'push'

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            sdk:
              - 'packages/agent-sdk/src/**'
              - 'packages/agent-sdk/package.json'
              - 'packages/desktop/src/**'
              - 'packages/vscode/src/**'
              - 'packages/webview/src/**'
              - 'scripts/check-sdk-surface.mjs'
              - '.github/workflows/ci.yml'

      # Cache pnpm/action-setup's install dir so concurrent jobs skip
      # re-downloading the action tarball from codeload (429 rate limits,
      # pnpm/action-setup#177). On hit we skip the action and prepend its bin
      # dirs to PATH ourselves. The key pins the pnpm version — keep it in
      # sync with the `version` input below (package.json "packageManager").
      - name: Cache pnpm install
        if: steps.filter.outputs.sdk == 'true'
        id: pnpm-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/setup-pnpm
          key: pnpm-setup-v5-${{ runner.os }}-${{ runner.arch }}-12.18.0

      - name: Add cached pnpm to PATH
        if: steps.filter.outputs.sdk == 'true' && steps.pnpm-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          PNPM_HOME="${USERPROFILE:-$HOME}/.cache/setup-pnpm/node_modules/.bin"
          PNPM_BIN="$PNPM_HOME/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PNPM_HOME="${PNPM_HOME//\//\\}"
            PNPM_BIN="${PNPM_BIN//\//\\}"
          fi
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"

      - name: Setup pnpm (cache miss)
        if: steps.filter.outputs.sdk == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 12.18.0
          dest: ~/.cache/setup-pnpm
          run_install: false

      - name: Setup Node.js
        if: steps.filter.outputs.sdk == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.sdk == 'true'
        run: pnpm install --frozen-lockfile

      # 只看 SDK 自己的 dist（闭包与入口加载检查都基于它），不构建宿主产物。
      - name: Build SDK
        if: steps.filter.outputs.sdk == 'true'
        run: pnpm -F wave-agent-sdk build

      - name: Check SDK surface
        if: steps.filter.outputs.sdk == 'true'
        run: node scripts/check-sdk-surface.mjs

  webview-e2e:
    runs-on: ubuntu-latest
    # Real-browser tests (packages/webview/e2e/*.e2e.ts) — what browser mode
    # cannot cover: real CDP input, real reload, touch/device emulation. Used to
    # be post-merge only; moved into the PR gate after the browser-mode
    # migration cut the suite from 254 cases / 5 min to 155 / ~1.5 min.
    # Unlike the other jobs, e2e test file changes must trigger this job, so
    # webview/e2e is not excluded from the paths filter.
    if: github.event_name != 'push'

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!scripts/**'
              - '!LICENSE'

      # Cache pnpm/action-setup's install dir so concurrent jobs skip
      # re-downloading the action tarball from codeload (429 rate limits,
      # pnpm/action-setup#177). On hit we skip the action and prepend its bin
      # dirs to PATH ourselves. The key pins the pnpm version — keep it in
      # sync with the `version` input below (package.json "packageManager").
      - name: Cache pnpm install
        if: steps.filter.outputs.code == 'true'
        id: pnpm-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/setup-pnpm
          key: pnpm-setup-v5-${{ runner.os }}-${{ runner.arch }}-12.18.0

      - name: Add cached pnpm to PATH
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          # Mirror pnpm/action-setup's env: node_modules/.bin/bin holds the
          # self-updated target version (higher precedence), node_modules/.bin
          # the bootstrap symlink. GITHUB_PATH is used verbatim, so write
          # native Windows paths on Windows runners.
          PNPM_HOME="${USERPROFILE:-$HOME}/.cache/setup-pnpm/node_modules/.bin"
          PNPM_BIN="$PNPM_HOME/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PNPM_HOME="${PNPM_HOME//\//\\}"
            PNPM_BIN="${PNPM_BIN//\//\\}"
          fi
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"

      - name: Setup pnpm (cache miss)
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 12.18.0
          dest: ~/.cache/setup-pnpm
          run_install: false

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      # Test the bundle users actually receive. `pnpm build` compiles webview in
      # development mode (unminified, development React — ~11 MB), while every
      # release pipeline ships `compile --production` (~4.6 MB, minified,
      # production React). e2e has therefore been exercising an artifact no user
      # ever gets. Order matters in two directions:
      #  - webview depends on `wave-agent-sdk`'s build output (its bundle imports
      #    `wave-agent-sdk/constants|types`, which resolve into the SDK's `dist`),
      #    so the dependencies must be built before webview is compiled;
      #  - `wave-desktop`'s build runs `sync:webview`, which copies webview's
      #    `chat.js` into the desktop bundle — so compiling webview before the
      #    rest means it is built exactly once AND the desktop bundle embeds the
      #    production copy (it used to embed the development one).
      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: |
          pnpm --filter "wave-webview^..." build
          pnpm -F wave-webview run compile -- --production
          pnpm -r --filter '!wave-webview' --workspace-concurrency=1 build

      # Same key as the PR-tier `check` job, and therefore as `pages.yml` on
      # `main`, which is the only side that can hand out a restore — see the
      # note there for why the scope forces this.
      - name: Cache Playwright browsers
        if: steps.filter.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      # `--with-deps` on every run, cache hit included — see the long note in the
      # `check` job: this is what puts Chinese fonts on the runner, and without
      # them the virtual-scroll geometry assertions go red for a reason no real
      # user ever hits. The 19s it costs is the price of the environment.
      - name: Install Playwright Chromium
        if: steps.filter.outputs.code == 'true'
        run: pnpm -F wave-webview exec playwright install --with-deps chromium

      - name: Real-browser e2e tests
        if: steps.filter.outputs.code == 'true'
        run: pnpm -F wave-webview run test:e2e
