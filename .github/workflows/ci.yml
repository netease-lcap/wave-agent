name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # PR gate: every test of the two heaviest packages that need no browser
    # (agent-sdk, code) — one `test` per package, no unit/integration split —
    # each sharded in two halves via vitest --shard and run on separate runners
    # in parallel. agent-sdk's `test` includes `tests/integration/**` and its
    # `*.integration.test.ts`, which used to be a separate `integration` job.
    # wave-webview's leg is `check-webview`: it runs in a real Chromium, so it
    # needs the Playwright image rather than this bare runner.
    if: github.event_name != 'push'

    strategy:
      fail-fast: false
      matrix:
        pkg: [agent-sdk, code]
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!scripts/**'
              - '!packages/webview/e2e/**'
              - '!packages/webview/demo/**'
              - '!LICENSE'

      # Cache pnpm/action-setup's install dir so concurrent jobs skip
      # re-downloading the action tarball from codeload (429 rate limits,
      # pnpm/action-setup#177). On hit we skip the action and prepend its bin
      # dirs to PATH ourselves. The key pins the pnpm version — keep it in
      # sync with the `version` input below (package.json "packageManager").
      - name: Cache pnpm install
        if: steps.filter.outputs.code == 'true'
        id: pnpm-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/setup-pnpm
          key: pnpm-setup-v5-${{ runner.os }}-${{ runner.arch }}-12.18.0

      - name: Add cached pnpm to PATH
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          # Mirror pnpm/action-setup's env: node_modules/.bin/bin holds the
          # self-updated target version (higher precedence), node_modules/.bin
          # the bootstrap symlink. GITHUB_PATH is used verbatim, so write
          # native Windows paths on Windows runners.
          PNPM_HOME="${USERPROFILE:-$HOME}/.cache/setup-pnpm/node_modules/.bin"
          PNPM_BIN="$PNPM_HOME/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PNPM_HOME="${PNPM_HOME//\//\\}"
            PNPM_BIN="${PNPM_BIN//\//\\}"
          fi
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"

      - name: Setup pnpm (cache miss)
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 12.18.0
          dest: ~/.cache/setup-pnpm
          run_install: false

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: pnpm build

      - name: Tests (shard ${{ matrix.shard }}/2)
        if: steps.filter.outputs.code == 'true'
        run: pnpm -F wave-${{ matrix.pkg }} test --shard=${{ matrix.shard }}/2

  check-webview:
    runs-on: ubuntu-latest
    # wave-webview's unit suite runs in a real Chromium (vitest browser mode):
    # jsdom does no layout, and the components under test measure their own
    # geometry. Split out of `check` because it needs a browser *and* CJK
    # fonts, and the Playwright image carries both.
    #
    # Why an image instead of `playwright install --with-deps`: that command
    # fetches ~21.9 MB of font packages from whichever apt mirror the runner
    # picked, and the mirror is not stable — across 21 measured jobs, 30% got
    # `us-east-2.ec2.archive.ubuntu.com` at ~110 kB/s (3m19s to 7m29s in the
    # step) while the rest got `azure.archive.ubuntu.com` (8-19s). The image is
    # a flat 15.5-16.5s pull (0.91 GB, three runners measured) and it also
    # replaces the 261 MB browser cache restore, so it is never slower and it
    # has no tail. Pinning a mirror is not the fix — `actions/runner-images`
    # #14596 and #15142 show every mirror has bad days.
    #
    # The tag must match the `playwright` version resolved in pnpm-lock.yaml:
    # the image ships browsers for exactly one release (1.61.1 -> chromium-1228).
    # The guard step below fails loudly on drift instead of quietly letting
    # Playwright download its own browser again.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    if: github.event_name != 'push'

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!scripts/**'
              - '!packages/webview/e2e/**'
              - '!packages/webview/demo/**'
              - '!LICENSE'

      # Same pnpm cache as the other jobs: what gets rate limited is the action
      # tarball from codeload (pnpm/action-setup#177), not the store.
      - name: Cache pnpm install
        if: steps.filter.outputs.code == 'true'
        id: pnpm-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/setup-pnpm
          key: pnpm-setup-v5-${{ runner.os }}-${{ runner.arch }}-12.18.0

      - name: Add cached pnpm to PATH
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          PNPM_HOME="${USERPROFILE:-$HOME}/.cache/setup-pnpm/node_modules/.bin"
          PNPM_BIN="$PNPM_HOME/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PNPM_HOME="${PNPM_HOME//\//\\}"
            PNPM_BIN="${PNPM_BIN//\//\\}"
          fi
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"

      - name: Setup pnpm (cache miss)
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 12.18.0
          dest: ~/.cache/setup-pnpm
          run_install: false

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: pnpm build

      # An image is only worth its 16s if it really carries the browser this
      # lockfile expects. A version drift would silently re-enable the download
      # path — and without --with-deps it would lose the fonts too, which is a
      # deterministic fake red in the virtual-scroll geometry assertions.
      - name: Guard - image ships the browser the lockfile expects
        if: steps.filter.outputs.code == 'true'
        run: |
          expected="1.61.1"
          installed="$(pnpm -F wave-webview exec playwright --version | awk '{print $NF}')"
          if [ "$installed" != "$expected" ]; then
            echo "::error::pnpm-lock.yaml resolves playwright $installed, but the container image is v$expected-noble. Bump the image tag and this guard together."
            exit 1
          fi
          location="$(pnpm -F wave-webview exec playwright install --dry-run chromium \
            | sed -e 's/\x1b\[[0-9;]*m//g' \
            | sed -n 's/.*Install location: *//p' | head -1 | tr -d '[:space:]')"
          if [ ! -d "$location" ]; then
            echo "::error::no preinstalled Chromium at '$location' — the image and the lockfile disagree"
            exit 1
          fi
          echo "playwright $installed will run $location, straight from the image"

      - name: Tests (shard ${{ matrix.shard }}/2)
        if: steps.filter.outputs.code == 'true'
        run: pnpm -F wave-webview test --shard=${{ matrix.shard }}/2

  check-extras:
    runs-on: ubuntu-latest
    # PR gate, runs in parallel with check: type-check + lint (platform
    # agnostic, run once for all packages here) and the two small packages'
    # tests, which are fast enough to stay unsharded.
    #
    # `wave-desktop test` runs BOTH of its vitest projects: the mocked
    # unit layer and the real-host layer (real DesktopHost driving a real
    # `wave --stdio` child process, local model server instead of an LLM, no
    # display — the Electron shell is stubbed). The real-host suite used to be
    # its own `real-host-e2e` job; it moved here because both layers share the
    # same `pnpm build` and the machine, so one job covers them without adding
    # a runner to the critical path.
    #
    # 两条秒级静态契约检查也挂在这里（它们本来是独立的 sdk-surface job）：两条要的
    # 正是「装好依赖 + 全量 build 之后的 SDK dist」，本 job 两样都有，独立成 job 只是
    # 再付一次 checkout + setup + install（约 20s）。代价是失败归属变粗——公共面/契约
    # 违规现在报在 `check-extras` 上而不是一个专门的 check 名；同时这两条从「不阻断
    # 合并」变成**阻断**（check-extras 是 ruleset 的 required context，原来的
    # sdk-surface 不是）。
    #
    # - SDK 公共面 / 宿主边界自检（scripts/check-sdk-surface.mjs），四项：
    #   ① 宿主包只能从允许的 SDK 子路径导入（desktop/vscode → `/host`，webview →
    #      `/types` + `/constants`；桶入口与 `dist/...` 深路径都算违规）；
    #   ② `/host` 入口的依赖闭包必须零第三方依赖且在体积预算内；
    #   ③ 把 `@vscode/*` 从解析环境里去掉后每个 SDK 入口仍能加载（可选平台包只许
    #      惰性解析——v1.2.5 崩的就是顶层 re-export）；
    #   ④ `sideEffects: false` 在位。
    # - webview→host 消息契约审计（scripts/audit-webview-commands.mjs）：新 webview
    #   发送命令若在 4 个路由实例（vscode chat/settings、desktop、jetbrains）任一漏
    #   注册即红（#2086/#2087/JB backgroundCurrentTask 类 bug）；host 侧新增 webview
    #   永不发送的 case 若未登记脚本 legacy 豁免清单也红。
    #
    # 两条各有自己的 paths 门控（`sdk` / `contract`）：`code` filter 是排除式的，
    # 排掉了 'scripts/**'，而脚本自身的改动必须能触发它们，所以并不进 `code`。
    # 安装 / build 的 `if` 因此取三个 filter 的并集。
    if: github.event_name != 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!scripts/**'
              - '!packages/webview/e2e/**'
              - '!packages/webview/demo/**'
              - '!LICENSE'
            sdk:
              - 'packages/agent-sdk/src/**'
              - 'packages/agent-sdk/package.json'
              - 'packages/desktop/src/**'
              - 'packages/vscode/src/**'
              - 'packages/webview/src/**'
              - 'scripts/check-sdk-surface.mjs'
              - '.github/workflows/ci.yml'
            contract:
              - 'packages/webview/src/**'
              - 'packages/vscode/src/session/messageHandler.ts'
              - 'packages/desktop/src/main/desktopHost.ts'
              - 'packages/jetbrains/src/main/kotlin/com/wave/jetbrains/session/MessageHandler.kt'
              - 'scripts/audit-webview-commands.mjs'
              - '.github/workflows/ci.yml'

      # Cache pnpm/action-setup's install dir so concurrent jobs skip
      # re-downloading the action tarball from codeload (429 rate limits,
      # pnpm/action-setup#177). On hit we skip the action and prepend its bin
      # dirs to PATH ourselves. The key pins the pnpm version — keep it in
      # sync with the `version` input below (package.json "packageManager").
      - name: Cache pnpm install
        if: steps.filter.outputs.code == 'true' || steps.filter.outputs.sdk == 'true' || steps.filter.outputs.contract == 'true'
        id: pnpm-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/setup-pnpm
          key: pnpm-setup-v5-${{ runner.os }}-${{ runner.arch }}-12.18.0

      - name: Add cached pnpm to PATH
        if: (steps.filter.outputs.code == 'true' || steps.filter.outputs.sdk == 'true' || steps.filter.outputs.contract == 'true') && steps.pnpm-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          # Mirror pnpm/action-setup's env: node_modules/.bin/bin holds the
          # self-updated target version (higher precedence), node_modules/.bin
          # the bootstrap symlink. GITHUB_PATH is used verbatim, so write
          # native Windows paths on Windows runners.
          PNPM_HOME="${USERPROFILE:-$HOME}/.cache/setup-pnpm/node_modules/.bin"
          PNPM_BIN="$PNPM_HOME/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PNPM_HOME="${PNPM_HOME//\//\\}"
            PNPM_BIN="${PNPM_BIN//\//\\}"
          fi
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"

      - name: Setup pnpm (cache miss)
        if: (steps.filter.outputs.code == 'true' || steps.filter.outputs.sdk == 'true' || steps.filter.outputs.contract == 'true') && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 12.18.0
          dest: ~/.cache/setup-pnpm
          run_install: false

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true' || steps.filter.outputs.sdk == 'true' || steps.filter.outputs.contract == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true' || steps.filter.outputs.sdk == 'true' || steps.filter.outputs.contract == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.filter.outputs.code == 'true' || steps.filter.outputs.sdk == 'true' || steps.filter.outputs.contract == 'true'
        run: pnpm build

      - name: Type-check, lint, small package tests
        if: steps.filter.outputs.code == 'true'
        run: |
          # 必须串行：多个 tsrs 进程同时构建 program 时，模块解析会偶发漏掉包
          # （幻影 TS2307）。根脚本 type-check 已带 --workspace-concurrency=1，
          # 这里不要再加 --parallel。
          pnpm run type-check
          pnpm -r --parallel lint
          pnpm -F wave-desktop -F wave-vscode -F wave-webview-fixtures test

      # 原 sdk-surface job 的两条静态契约检查。`Check SDK surface` 读上一级
      # Build 产出的 packages/agent-sdk/dist，所以必须排在 Build 之后。
      - name: Static contract checks
        if: steps.filter.outputs.sdk == 'true' || steps.filter.outputs.contract == 'true'
        run: |
          node scripts/check-sdk-surface.mjs
          node scripts/audit-webview-commands.mjs

  webview-e2e:
    runs-on: ubuntu-latest
    # Real-browser tests (packages/webview/e2e/*.e2e.ts) — what browser mode
    # cannot cover: real CDP input, real reload, touch/device emulation. Used to
    # be post-merge only; moved into the PR gate after the browser-mode
    # migration cut the suite from 254 cases / 5 min to 155 / ~1.5 min.
    # Unlike the other jobs, e2e test file changes must trigger this job, so
    # webview/e2e is not excluded from the paths filter.
    if: github.event_name != 'push'
    #
    # Runs inside the Playwright image for the same reason as `check-webview`:
    # it carries the browser and the CJK fonts, so neither the 261 MB cache
    # restore nor `playwright install --with-deps` is needed, and the ~16s pull
    # replaces an apt step that took 8s to 7m29s depending on the mirror the
    # runner drew. Keep this tag equal to the `playwright` version in
    # pnpm-lock.yaml; the guard below enforces it.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!scripts/**'
              - '!LICENSE'

      # Cache pnpm/action-setup's install dir so concurrent jobs skip
      # re-downloading the action tarball from codeload (429 rate limits,
      # pnpm/action-setup#177). On hit we skip the action and prepend its bin
      # dirs to PATH ourselves. The key pins the pnpm version — keep it in
      # sync with the `version` input below (package.json "packageManager").
      - name: Cache pnpm install
        if: steps.filter.outputs.code == 'true'
        id: pnpm-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/setup-pnpm
          key: pnpm-setup-v5-${{ runner.os }}-${{ runner.arch }}-12.18.0

      - name: Add cached pnpm to PATH
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          # Mirror pnpm/action-setup's env: node_modules/.bin/bin holds the
          # self-updated target version (higher precedence), node_modules/.bin
          # the bootstrap symlink. GITHUB_PATH is used verbatim, so write
          # native Windows paths on Windows runners.
          PNPM_HOME="${USERPROFILE:-$HOME}/.cache/setup-pnpm/node_modules/.bin"
          PNPM_BIN="$PNPM_HOME/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PNPM_HOME="${PNPM_HOME//\//\\}"
            PNPM_BIN="${PNPM_BIN//\//\\}"
          fi
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"

      - name: Setup pnpm (cache miss)
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 12.18.0
          dest: ~/.cache/setup-pnpm
          run_install: false

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      # Test the bundle users actually receive. `pnpm build` compiles webview in
      # development mode (unminified, development React — ~11 MB), while every
      # release pipeline ships `compile --production` (~4.6 MB, minified,
      # production React). e2e has therefore been exercising an artifact no user
      # ever gets. Order matters in two directions:
      #  - webview depends on `wave-agent-sdk`'s build output (its bundle imports
      #    `wave-agent-sdk/constants|types`, which resolve into the SDK's `dist`),
      #    so the dependencies must be built before webview is compiled;
      #  - `wave-desktop`'s build runs `sync:webview`, which copies webview's
      #    `chat.js` into the desktop bundle — so compiling webview before the
      #    rest means it is built exactly once AND the desktop bundle embeds the
      #    production copy (it used to embed the development one).
      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: |
          pnpm --filter "wave-webview^..." build
          pnpm -F wave-webview run compile -- --production
          pnpm -r --filter '!wave-webview' --workspace-concurrency=1 build

      # Both the browser and the CJK fonts come from the image, so the browser
      # cache and `--with-deps` are gone. The guard keeps the two in sync: a
      # lockfile bump without an image bump would silently re-enable the
      # download path (and, with no --with-deps, lose the fonts with it).
      - name: Guard - image ships the browser the lockfile expects
        if: steps.filter.outputs.code == 'true'
        run: |
          expected="1.61.1"
          installed="$(pnpm -F wave-webview exec playwright --version | awk '{print $NF}')"
          if [ "$installed" != "$expected" ]; then
            echo "::error::pnpm-lock.yaml resolves playwright $installed, but the container image is v$expected-noble. Bump the image tag and this guard together."
            exit 1
          fi
          location="$(pnpm -F wave-webview exec playwright install --dry-run chromium \
            | sed -e 's/\x1b\[[0-9;]*m//g' \
            | sed -n 's/.*Install location: *//p' | head -1 | tr -d '[:space:]')"
          if [ ! -d "$location" ]; then
            echo "::error::no preinstalled Chromium at '$location' — the image and the lockfile disagree"
            exit 1
          fi
          echo "playwright $installed will run $location, straight from the image"

      - name: Real-browser e2e tests
        if: steps.filter.outputs.code == 'true'
        run: pnpm -F wave-webview run test:e2e
