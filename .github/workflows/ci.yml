          key: pnpm-setup-v5-${{ runner.os }}-${{ runner.arch }}-11.9.0

      - name: Add cached pnpm to PATH
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          # Mirror pnpm/action-setup's env: node_modules/.bin/bin holds the
          # self-updated target version (higher precedence), node_modules/.bin
          # the bootstrap symlink. GITHUB_PATH is used verbatim, so write
          # native Windows paths on Windows runners.
          PNPM_HOME="${USERPROFILE:-$HOME}/.cache/setup-pnpm/node_modules/.bin"
          PNPM_BIN="$PNPM_HOME/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PNPM_HOME="${PNPM_HOME//\//\\}"
            PNPM_BIN="${PNPM_BIN//\//\\}"
          fi
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"

      - name: Setup pnpm (cache miss)
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 11.9.0
          dest: ~/.cache/setup-pnpm
          run_install: false

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: pnpm build

      - name: Type-check, lint, small package unit tests
        if: steps.filter.outputs.code == 'true'
        run: |
          pnpm -r --parallel type-check
          pnpm -r --parallel lint
          pnpm -F wave-desktop -F wave-vscode test:unit

  webview-command-audit:
    runs-on: ubuntu-latest
    # PR gate: 静态审计 webview→host 消息契约（scripts/audit-webview-commands.mjs）。
    # 新 webview 发送命令若在 4 个路由实例（vscode chat/settings、desktop、
    # jetbrains）任一漏注册即红（#2086/#2087/JB backgroundCurrentTask 类 bug）；
    # host 侧新增 webview 永不发送的 case 若未登记脚本 legacy 豁免清单也红。
    # 纯 Node 无依赖、无 pnpm 安装，秒级完成——独立 job 而非并入 check-extras，
    # 避免被 code filter 的 '!scripts/**' 排除（脚本自身改动也要触发）。
    if: github.event_name != 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            contract:
              - 'packages/webview/src/**'
              - 'packages/vscode/src/session/messageHandler.ts'
              - 'packages/desktop/src/main/desktopHost.ts'
              - 'packages/jetbrains/src/main/kotlin/com/wave/jetbrains/session/MessageHandler.kt'
              - 'scripts/audit-webview-commands.mjs'
              - '.github/workflows/ci.yml'

      - name: Setup Node.js
        if: steps.filter.outputs.contract == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Audit webview→host command contract
        if: steps.filter.outputs.contract == 'true'
        run: node scripts/audit-webview-commands.mjs

  integration:
    runs-on: ubuntu-latest
    # Post-merge integration tests (tests/integration/** + *.integration.test.ts).
    # Not gating PRs; runs after merge to main or manually via workflow_dispatch.
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!scripts/**'
              - '!packages/webview/e2e/**'
              - '!packages/webview/demo/**'
              - '!LICENSE'

