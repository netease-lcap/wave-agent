name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # PR gate: unit tests for the three heaviest packages (agent-sdk, code,
    # webview), each sharded in two halves via vitest --shard and run on
    # separate runners in parallel. Integration tests run post-merge (push main).
    if: github.event_name != 'push'

    strategy:
      fail-fast: false
      matrix:
        pkg: [agent-sdk, code, webview]
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!scripts/**'
              - '!packages/webview/e2e/**'
              - '!packages/webview/demo/**'
              - '!LICENSE'

      # Cache pnpm/action-setup's install dir so concurrent jobs skip
      # re-downloading the action tarball from codeload (429 rate limits,
      # pnpm/action-setup#177). On hit we skip the action and prepend its bin
      # dirs to PATH ourselves. The key pins the pnpm version — keep it in
      # sync with the `version` input below (package.json "packageManager").
      - name: Cache pnpm install
        if: steps.filter.outputs.code == 'true'
        id: pnpm-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/setup-pnpm
          key: pnpm-setup-v5-${{ runner.os }}-${{ runner.arch }}-12.18.0

      - name: Add cached pnpm to PATH
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          # Mirror pnpm/action-setup's env: node_modules/.bin/bin holds the
          # self-updated target version (higher precedence), node_modules/.bin
          # the bootstrap symlink. GITHUB_PATH is used verbatim, so write
          # native Windows paths on Windows runners.
          PNPM_HOME="${USERPROFILE:-$HOME}/.cache/setup-pnpm/node_modules/.bin"
          PNPM_BIN="$PNPM_HOME/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PNPM_HOME="${PNPM_HOME//\//\\}"
            PNPM_BIN="${PNPM_BIN//\//\\}"
          fi
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"

      - name: Setup pnpm (cache miss)
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 12.18.0
          dest: ~/.cache/setup-pnpm
          run_install: false

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: pnpm build

      # Downloading Chromium is the biggest source of variance in this job:
      # 15-25s when the CDN is fast, 80-270s when it is not (observed across
      # 10 PR runs), and each of the two shards pays it. Keyed on the webview
      # package.json, which is what pins @playwright/test — a version bump
      # changes the key. A stale cache is harmless: playwright installs into a
      # version-named subdirectory of this folder, so it just downloads anew.
      - name: Cache Playwright browsers
        id: pw-cache
        if: steps.filter.outputs.code == 'true' && matrix.pkg == 'webview'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/webview/package.json') }}

      # wave-webview's unit suite runs in a real Chromium (vitest browser
      # mode): jsdom does no layout, and the components under test measure
      # their own geometry. Only that matrix leg needs the browser.
      #
      # `--with-deps` only on a cache miss. On a hit the binary is already in
      # ~/.cache/ms-playwright, so all it still does is `apt-get update` plus a
      # reinstall of libraries the runner image ships anyway — 19 of the step's
      # 20 measured seconds. A miss (fresh runner, new Playwright version) still
      # gets the full install: that is what makes the browser runnable at all.
      # If an image upgrade ever drops a shared library, Chromium fails to start
      # loudly here rather than silently inside a test, so the fast path is safe
      # to take.
      - name: Install Playwright Chromium (webview unit tests)
        if: steps.filter.outputs.code == 'true' && matrix.pkg == 'webview'
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm -F wave-webview exec playwright install chromium
          else
            pnpm -F wave-webview exec playwright install --with-deps chromium
          fi

      # 中文字体。runner 镜像默认不带 CJK，页面里的中文按 DejaVu 回退渲染 ——
      # 折行与行高和 `estimateRowHeight` 的估算差出一大截（实测 85px），虚拟滚动的
      # 几何断言因此在「无字体」环境下稳定红，而有字体时全绿。真机（Windows /
      # macOS 桌面、手机浏览器）都带中文字体，所以在无字体镜像上量到的不是用户会
      # 看到的东西。字体文件走 actions/cache：命中时拷进 ~/.local/share/fonts +
      # `fc-cache`（秒级），未命中才 apt（约 15s）。
      - name: Cache CJK fonts
        id: cjk-cache
        if: steps.filter.outputs.code == 'true' && matrix.pkg == 'webview'
        uses: actions/cache@v6
        with:
          path: ~/.cache/noto-cjk
          key: fonts-noto-cjk-v1

      - name: Install CJK fonts
        if: steps.filter.outputs.code == 'true' && matrix.pkg == 'webview'
        run: |
          mkdir -p ~/.local/share/fonts
          if ls ~/.cache/noto-cjk/* >/dev/null 2>&1; then
            cp ~/.cache/noto-cjk/* ~/.local/share/fonts/
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
            mkdir -p ~/.cache/noto-cjk
            # 只留常规两个字重：全套 ttc 有 298MB，缓存得不偿失。
            for f in NotoSansCJK-Regular.ttc NotoSansCJK-Bold.ttc NotoSansCJK-VF.otf.ttc; do
              cp "/usr/share/fonts/opentype/noto/$f" ~/.cache/noto-cjk/ 2>/dev/null || true
            done
          fi
          fc-cache -f >/dev/null
          # 装不上就当场失败：否则几何断言会在一个不代表真机的字体环境下静默变绿
          # 或变红，排查成本远高于这一行。
          test "$(fc-list :lang=zh | wc -l)" -gt 0

      - name: Unit tests (shard ${{ matrix.shard }}/2)
        if: steps.filter.outputs.code == 'true'
        run: pnpm -F wave-${{ matrix.pkg }} test:unit --shard=${{ matrix.shard }}/2

  check-extras:
    runs-on: ubuntu-latest
    # PR gate, runs in parallel with check: type-check + lint (platform
    # agnostic, run once for all packages here) and the two small packages'
    # unit tests, which are fast enough to stay unsharded.
    if: github.event_name != 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!scripts/**'
              - '!packages/webview/e2e/**'
              - '!packages/webview/demo/**'
              - '!LICENSE'

      # Cache pnpm/action-setup's install dir so concurrent jobs skip
      # re-downloading the action tarball from codeload (429 rate limits,
      # pnpm/action-setup#177). On hit we skip the action and prepend its bin
      # dirs to PATH ourselves. The key pins the pnpm version — keep it in
      # sync with the `version` input below (package.json "packageManager").
      - name: Cache pnpm install
        if: steps.filter.outputs.code == 'true'
        id: pnpm-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/setup-pnpm
          key: pnpm-setup-v5-${{ runner.os }}-${{ runner.arch }}-12.18.0

      - name: Add cached pnpm to PATH
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          # Mirror pnpm/action-setup's env: node_modules/.bin/bin holds the
          # self-updated target version (higher precedence), node_modules/.bin
          # the bootstrap symlink. GITHUB_PATH is used verbatim, so write
          # native Windows paths on Windows runners.
          PNPM_HOME="${USERPROFILE:-$HOME}/.cache/setup-pnpm/node_modules/.bin"
          PNPM_BIN="$PNPM_HOME/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PNPM_HOME="${PNPM_HOME//\//\\}"
            PNPM_BIN="${PNPM_BIN//\//\\}"
          fi
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"

      - name: Setup pnpm (cache miss)
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 12.18.0
          dest: ~/.cache/setup-pnpm
          run_install: false

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: pnpm build

      - name: Type-check, lint, small package unit tests
        if: steps.filter.outputs.code == 'true'
        run: |
          # 必须串行：多个 tsrs 进程同时构建 program 时，模块解析会偶发漏掉包
          # （幻影 TS2307）。根脚本 type-check 已带 --workspace-concurrency=1，
          # 这里不要再加 --parallel。
          pnpm run type-check
          pnpm -r --parallel lint
          pnpm -F wave-desktop -F wave-vscode -F wave-webview-fixtures test:unit

  webview-command-audit:
    runs-on: ubuntu-latest
    # PR gate: 静态审计 webview→host 消息契约（scripts/audit-webview-commands.mjs）。
    # 新 webview 发送命令若在 4 个路由实例（vscode chat/settings、desktop、
    # jetbrains）任一漏注册即红（#2086/#2087/JB backgroundCurrentTask 类 bug）；
    # host 侧新增 webview 永不发送的 case 若未登记脚本 legacy 豁免清单也红。
    # 纯 Node 无依赖、无 pnpm 安装，秒级完成——独立 job 而非并入 check-extras，
    # 避免被 code filter 的 '!scripts/**' 排除（脚本自身改动也要触发）。
    if: github.event_name != 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            contract:
              - 'packages/webview/src/**'
              - 'packages/vscode/src/session/messageHandler.ts'
              - 'packages/desktop/src/main/desktopHost.ts'
              - 'packages/jetbrains/src/main/kotlin/com/wave/jetbrains/session/MessageHandler.kt'
              - 'scripts/audit-webview-commands.mjs'
              - '.github/workflows/ci.yml'

      - name: Setup Node.js
        if: steps.filter.outputs.contract == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Audit webview→host command contract
        if: steps.filter.outputs.contract == 'true'
        run: node scripts/audit-webview-commands.mjs

  sdk-surface:
    runs-on: ubuntu-latest
    # PR gate：SDK 公共面 / 宿主边界自检（scripts/check-sdk-surface.mjs）。四项：
    #   ① 宿主包只能从允许的 SDK 子路径导入（desktop/vscode → `/host`，webview →
    #      `/types` + `/constants`；桶入口与 `dist/...` 深路径都算违规）；
    #   ② `/host` 入口的依赖闭包必须零第三方依赖且在体积预算内；
    #   ③ 把 `@vscode/*` 从解析环境里去掉后每个 SDK 入口仍能加载（可选平台包只许
    #      惰性解析——v1.2.5 崩的就是顶层 re-export）；
    #   ④ `sideEffects: false` 在位。
    # 只看依赖与入口的形状，秒级、不构建宿主产物，所以放 PR 档。
    if: github.event_name != 'push'

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            sdk:
              - 'packages/agent-sdk/src/**'
              - 'packages/agent-sdk/package.json'
              - 'packages/desktop/src/**'
              - 'packages/vscode/src/**'
              - 'packages/webview/src/**'
              - 'scripts/check-sdk-surface.mjs'
              - '.github/workflows/ci.yml'

      # Cache pnpm/action-setup's install dir so concurrent jobs skip
      # re-downloading the action tarball from codeload (429 rate limits,
      # pnpm/action-setup#177). On hit we skip the action and prepend its bin
      # dirs to PATH ourselves. The key pins the pnpm version — keep it in
      # sync with the `version` input below (package.json "packageManager").
      - name: Cache pnpm install
        if: steps.filter.outputs.sdk == 'true'
        id: pnpm-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/setup-pnpm
          key: pnpm-setup-v5-${{ runner.os }}-${{ runner.arch }}-12.18.0

      - name: Add cached pnpm to PATH
        if: steps.filter.outputs.sdk == 'true' && steps.pnpm-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          PNPM_HOME="${USERPROFILE:-$HOME}/.cache/setup-pnpm/node_modules/.bin"
          PNPM_BIN="$PNPM_HOME/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PNPM_HOME="${PNPM_HOME//\//\\}"
            PNPM_BIN="${PNPM_BIN//\//\\}"
          fi
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"

      - name: Setup pnpm (cache miss)
        if: steps.filter.outputs.sdk == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 12.18.0
          dest: ~/.cache/setup-pnpm
          run_install: false

      - name: Setup Node.js
        if: steps.filter.outputs.sdk == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.sdk == 'true'
        run: pnpm install --frozen-lockfile

      # 只看 SDK 自己的 dist（闭包与入口加载检查都基于它），不构建宿主产物。
      - name: Build SDK
        if: steps.filter.outputs.sdk == 'true'
        run: pnpm -F wave-agent-sdk build

      - name: Check SDK surface
        if: steps.filter.outputs.sdk == 'true'
        run: node scripts/check-sdk-surface.mjs

  integration:
    runs-on: ubuntu-latest
    # Integration tests (tests/integration/** + *.integration.test.ts). Used to
    # be post-merge only; moved into the PR gate once the webview e2e suite was
    # migrated to browser mode (which cut the shared build/test budget).
    if: github.event_name != 'push'

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!scripts/**'
              - '!packages/webview/e2e/**'
              - '!packages/webview/demo/**'
              - '!LICENSE'

      # Cache pnpm/action-setup's install dir so concurrent jobs skip
      # re-downloading the action tarball from codeload (429 rate limits,
      # pnpm/action-setup#177). On hit we skip the action and prepend its bin
      # dirs to PATH ourselves. The key pins the pnpm version — keep it in
      # sync with the `version` input below (package.json "packageManager").
      - name: Cache pnpm install
        if: steps.filter.outputs.code == 'true'
        id: pnpm-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/setup-pnpm
          key: pnpm-setup-v5-${{ runner.os }}-${{ runner.arch }}-12.18.0

      - name: Add cached pnpm to PATH
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          # Mirror pnpm/action-setup's env: node_modules/.bin/bin holds the
          # self-updated target version (higher precedence), node_modules/.bin
          # the bootstrap symlink. GITHUB_PATH is used verbatim, so write
          # native Windows paths on Windows runners.
          PNPM_HOME="${USERPROFILE:-$HOME}/.cache/setup-pnpm/node_modules/.bin"
          PNPM_BIN="$PNPM_HOME/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PNPM_HOME="${PNPM_HOME//\//\\}"
            PNPM_BIN="${PNPM_BIN//\//\\}"
          fi
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"

      - name: Setup pnpm (cache miss)
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 12.18.0
          dest: ~/.cache/setup-pnpm
          run_install: false

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: pnpm build

      - name: Integration tests
        if: steps.filter.outputs.code == 'true'
        run: pnpm run test:integration

  webview-e2e:
    runs-on: ubuntu-latest
    # Real-browser tests (packages/webview/e2e/*.e2e.ts) — what browser mode
    # cannot cover: real CDP input, real reload, touch/device emulation. Used to
    # be post-merge only; moved into the PR gate after the browser-mode
    # migration cut the suite from 254 cases / 5 min to 155 / ~1.5 min.
    # Unlike the other jobs, e2e test file changes must trigger this job, so
    # webview/e2e is not excluded from the paths filter.
    if: github.event_name != 'push'

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!scripts/**'
              - '!LICENSE'

      # Cache pnpm/action-setup's install dir so concurrent jobs skip
      # re-downloading the action tarball from codeload (429 rate limits,
      # pnpm/action-setup#177). On hit we skip the action and prepend its bin
      # dirs to PATH ourselves. The key pins the pnpm version — keep it in
      # sync with the `version` input below (package.json "packageManager").
      - name: Cache pnpm install
        if: steps.filter.outputs.code == 'true'
        id: pnpm-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/setup-pnpm
          key: pnpm-setup-v5-${{ runner.os }}-${{ runner.arch }}-12.18.0

      - name: Add cached pnpm to PATH
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          # Mirror pnpm/action-setup's env: node_modules/.bin/bin holds the
          # self-updated target version (higher precedence), node_modules/.bin
          # the bootstrap symlink. GITHUB_PATH is used verbatim, so write
          # native Windows paths on Windows runners.
          PNPM_HOME="${USERPROFILE:-$HOME}/.cache/setup-pnpm/node_modules/.bin"
          PNPM_BIN="$PNPM_HOME/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PNPM_HOME="${PNPM_HOME//\//\\}"
            PNPM_BIN="${PNPM_BIN//\//\\}"
          fi
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"

      - name: Setup pnpm (cache miss)
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 12.18.0
          dest: ~/.cache/setup-pnpm
          run_install: false

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      # Test the bundle users actually receive. `pnpm build` compiles webview in
      # development mode (unminified, development React — ~11 MB), while every
      # release pipeline ships `compile --production` (~4.6 MB, minified,
      # production React). e2e has therefore been exercising an artifact no user
      # ever gets. Order matters in two directions:
      #  - webview depends on `wave-agent-sdk`'s build output (its bundle imports
      #    `wave-agent-sdk/constants|types`, which resolve into the SDK's `dist`),
      #    so the dependencies must be built before webview is compiled;
      #  - `wave-desktop`'s build runs `sync:webview`, which copies webview's
      #    `chat.js` into the desktop bundle — so compiling webview before the
      #    rest means it is built exactly once AND the desktop bundle embeds the
      #    production copy (it used to embed the development one).
      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: |
          pnpm --filter "wave-webview^..." build
          pnpm -F wave-webview run compile -- --production
          pnpm -r --filter '!wave-webview' --workspace-concurrency=1 build

      # Same browser cache as the PR-tier `check` job (identical key, so the two
      # share entries): the e2e run downloads it once and reuses it until
      # @playwright/test is bumped.
      - name: Cache Playwright browsers
        id: pw-cache
        if: steps.filter.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/webview/package.json') }}

      # Same split as the `check` job: `--with-deps` only when the cache missed
      # (it then has to download the browser AND make it runnable). On a hit the
      # apt step is dead weight — 19 of this step's 20 measured seconds.
      - name: Install Playwright Chromium
        if: steps.filter.outputs.code == 'true'
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm -F wave-webview exec playwright install chromium
          else
            pnpm -F wave-webview exec playwright install --with-deps chromium
          fi

      # Same CJK font install as the `check` job (shared cache key). Without it the
      # runner falls back to DejaVu for Chinese text, line boxes come out ~85px off
      # the estimator, and the virtual-scroll geometry assertions go red for a
      # reason no real user ever hits.
      - name: Cache CJK fonts
        id: cjk-cache
        if: steps.filter.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/noto-cjk
          key: fonts-noto-cjk-v1

      - name: Install CJK fonts
        if: steps.filter.outputs.code == 'true'
        run: |
          mkdir -p ~/.local/share/fonts
          if ls ~/.cache/noto-cjk/* >/dev/null 2>&1; then
            cp ~/.cache/noto-cjk/* ~/.local/share/fonts/
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
            mkdir -p ~/.cache/noto-cjk
            # 只留常规两个字重：全套 ttc 有 298MB，缓存得不偿失。
            for f in NotoSansCJK-Regular.ttc NotoSansCJK-Bold.ttc NotoSansCJK-VF.otf.ttc; do
              cp "/usr/share/fonts/opentype/noto/$f" ~/.cache/noto-cjk/ 2>/dev/null || true
            done
          fi
          fc-cache -f >/dev/null
          test "$(fc-list :lang=zh | wc -l)" -gt 0

      - name: Real-browser e2e tests
        if: steps.filter.outputs.code == 'true'
        run: pnpm -F wave-webview run test:e2e

  real-host-e2e:
    runs-on: ubuntu-latest
    # Real-host tests (packages/desktop/tests/integration/*.integration.test.ts):
    # the real DesktopHost driving a real `wave --stdio` child process, with a
    # local OpenAI-compatible model server instead of a real LLM. Used to be
    # post-merge only; moved into the PR gate together with `integration` and
    # `webview-e2e`. No display needed: the Electron shell is stubbed, the CLI
    # is plain Node.
    if: github.event_name != 'push'

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!scripts/**'
              - '!LICENSE'

      # Cache pnpm/action-setup's install dir so concurrent jobs skip
      # re-downloading the action tarball from codeload (429 rate limits,
      # pnpm/action-setup#177). On hit we skip the action and prepend its bin
      # dirs to PATH ourselves. The key pins the pnpm version — keep it in
      # sync with the `version` input below (package.json "packageManager").
      - name: Cache pnpm install
        if: steps.filter.outputs.code == 'true'
        id: pnpm-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/setup-pnpm
          key: pnpm-setup-v5-${{ runner.os }}-${{ runner.arch }}-12.18.0

      - name: Add cached pnpm to PATH
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          # Mirror pnpm/action-setup's env: node_modules/.bin/bin holds the
          # self-updated target version (higher precedence), node_modules/.bin
          # the bootstrap symlink. GITHUB_PATH is used verbatim, so write
          # native Windows paths on Windows runners.
          PNPM_HOME="${USERPROFILE:-$HOME}/.cache/setup-pnpm/node_modules/.bin"
          PNPM_BIN="$PNPM_HOME/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PNPM_HOME="${PNPM_HOME//\//\\}"
            PNPM_BIN="${PNPM_BIN//\//\\}"
          fi
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"

      - name: Setup pnpm (cache miss)
        if: steps.filter.outputs.code == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 12.18.0
          dest: ~/.cache/setup-pnpm
          run_install: false

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      # The suite drives the workspace CLI (packages/code/bin/wave-code.js →
      # dist/bundle/wave.mjs) and imports the built SDK, so a full build is required.
      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: pnpm build

      - name: Real-host integration tests
        if: steps.filter.outputs.code == 'true'
        run: pnpm -F wave-desktop run test:realhost
