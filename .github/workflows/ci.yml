          dest: ~/.cache/setup-pnpm
          run_install: false

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: pnpm build

      - name: Integration tests
        if: steps.filter.outputs.code == 'true'
        run: pnpm run test:integration

  webview-e2e:
    runs-on: ubuntu-latest
    # Post-merge real-browser tests (packages/webview/e2e/*.e2e.ts). Same
    # trigger timing as integration: not gating PRs; runs after merge to main
    # or manually via workflow_dispatch. Unlike the other jobs, e2e test file
    # changes must trigger this job, so webview/e2e is not excluded.
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!scripts/**'
              - '!LICENSE'

      # Cache pnpm/action-setup's install dir so concurrent jobs skip
      # re-downloading the action tarball from codeload (429 rate limits,
      # pnpm/action-setup#177). On hit we skip the action and prepend its bin
      # dirs to PATH ourselves. The key pins the pnpm version — keep it in
