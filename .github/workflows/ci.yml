name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Unit tests + coverage gate PRs; integration tests run post-merge (push main).
    if: github.event_name != 'push'

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!scripts/**'
              - '!packages/webview/e2e/**'
              - '!LICENSE'

      - name: Setup pnpm
        if: steps.filter.outputs.code == 'true'
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: pnpm build

      - name: CI (unit tests + coverage)
        if: steps.filter.outputs.code == 'true'
        run: pnpm run ci

  integration:
    runs-on: ubuntu-latest
    # Post-merge integration tests (tests/integration/** + *.integration.test.ts).
    # Not gating PRs; runs after merge to main or manually via workflow_dispatch.
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!docs/**'
              - '!scripts/**'
              - '!packages/webview/e2e/**'
              - '!LICENSE'

      - name: Setup pnpm
        if: steps.filter.outputs.code == 'true'
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: pnpm build

      - name: Integration tests
        if: steps.filter.outputs.code == 'true'
        run: pnpm run test:integration
