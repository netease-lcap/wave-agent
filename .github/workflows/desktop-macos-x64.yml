name: Desktop macOS x64 (Intel, manual)

# Intel Mac 用户极少，所以 x64 是**手动旁路构建**，不进发版链路：
# - 只由 workflow_dispatch 触发（没有 tag、不产出 tag）
# - 不上传 GitHub Release、不提交 codechat 发布台账与 feed（不动 publish.yml）
# - 产物只留 CI artifact，由需要的人自行下载安装
#
# 配套的宿主约束：x64 构建**完全不查更新** —— feed 里的 mac 更新包只有 arm64
# 一份，electron-updater 不区分架构，拉下来替换后 Intel 机器上的应用起不来。
# 见 packages/desktop/src/main/updateAutoUpdater.ts 的 `updateChecksDisabled`，以及
# spec docs/specs/desktop/desktop-distribution.md「跨平台分发」场景 3 /
# 「桌面端自动更新」场景 12。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "构建哪个 ref（留空 = 触发时所在的分支）"
        required: false
        default: ""
      runner:
        description: "macOS runner。默认 macos-15-intel（x64 原生，原生模块无需交叉编译）；该标签不可用时改 macos-15（arm64 交叉构建）"
        required: false
        default: "macos-15-intel"
      retention_days:
        description: "artifact 保留天数"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  build-macos-x64:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # 与 publish.yml 的 build-desktop 同序：webview 从 wave-agent-sdk/dist 打包，
      # 桌面端用 bundleCli 收 wave-code/dist/bundle/wave.mjs 当内置 CLI。
      - name: Build agent-sdk dist
        run: pnpm -F wave-agent-sdk build

      - name: Build webview dist
        run: pnpm -F wave-webview run compile -- --production

      - name: Build wave-code dist
        run: pnpm -F wave-code build

      # `--x64` 不足以覆盖 package.json 里 mac.target 写死的 `arch: ["arm64"]`
      # （2026-11-09 run 42605610734 实测：命令行 --x64 仍打出 -arm64.dmg）。
      # 所以在包目录内生成一份临时 config，把 mac.target 换成 x64，用 `--config`
      # 顶掉 package.json 的 build —— 正式发版配置一个字不动。config 与
      # package.json 同目录，afterPack / extraResources / directories 的相对路径
      # 解析结果不变。
      - name: Generate x64 builder config
        run: |
          node -e '
            const fs = require("node:fs");
            const build = JSON.parse(
              fs.readFileSync("packages/desktop/package.json", "utf8"),
            ).build;
            build.mac.target = [
              { target: "dmg", arch: ["x64"] },
              { target: "zip", arch: ["x64"] },
            ];
            fs.writeFileSync(
              "packages/desktop/electron-builder.x64.json",
              JSON.stringify(build, null, 2),
            );
          '

      # 与 `dist` 脚本的前半段等价（syncWebview + bundleCli + tsup）。
      - name: Compile desktop app
        run: pnpm -F wave-desktop run compile

      # 签名 + 公证与正式版同一套凭证（Developer ID 证书不区分架构）。APPLE_API_KEY
      # 必须是 .p8 的**路径**：@electron/notarize 原样透传给 `notarytool --key`。
      #
      # 若在 arm64 runner（macos-15）上做交叉构建时卡在原生模块重编，追加
      # `--config.npmRebuild=false`：node-pty 带 N-API prebuilds（含
      # prebuilds/darwin-x64/），Electron 43 下无需重编。
      - name: Build x64 installer
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          APPLE_API_KEY="$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8" \
            pnpm -F wave-desktop exec electron-builder \
              --mac --config ./electron-builder.x64.json --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # 守住「打出来的真是 x64」：config 覆盖万一失效，这里会让本次构建红掉，
      # 而不是把一个 arm64 包当 Intel 包发出去。
      - name: Verify the bundle is x64 and correctly signed
        run: |
          set -euo pipefail
          ls -lh packages/desktop/release/
          APP="$(find packages/desktop/release -maxdepth 2 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::没有找到 .app 产物"; exit 1
          fi
          file "$APP/Contents/MacOS/"* | tee /tmp/wave-arch.txt
          if ! grep -q 'x86_64' /tmp/wave-arch.txt; then
            echo "::error::产物不是 x86_64：x64 config 未生效"; exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Read desktop version
        id: version
        run: |
          echo "version=$(node -p "JSON.parse(require('fs').readFileSync('packages/desktop/package.json','utf8')).version")" >> "$GITHUB_OUTPUT"

      - name: Upload installers as artifact
        uses: actions/upload-artifact@v5
        with:
          name: codewave-ide-macos-x64-${{ steps.version.outputs.version }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*-mac.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
