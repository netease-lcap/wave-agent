name: CI (JetBrains)

# Runs the JetBrains plugin's Gradle (JUnit) test suite.
# The Node-based `pnpm -r test` in ci.yml skips this package (it has no
# package.json), so without this workflow BinaryResolver and other Kotlin
# logic has no test coverage.

on:
  # Post-merge only (aligned with ci.yml's integration job and ci-windows.yml):
  # not gating PRs; runs after merge to main or manually via workflow_dispatch.
  # dorny/paths-filter below skips all steps for non-JetBrains changes.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-jetbrains-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-jetbrains:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect jetbrains changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            jetbrains:
              - 'packages/jetbrains/**'

      - name: Setup JDK 17
        if: steps.filter.outputs.jetbrains == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        if: steps.filter.outputs.jetbrains == 'true'
        uses: gradle/actions/setup-gradle@v6

      # The Gradle `classes` task depends on copyWebviewAssets + bundleCli,
      # which read from packages/webview/dist and packages/code/dist — without
      # them the build fails (PR #1852's check-jetbrains failure).
      - uses: pnpm/action-setup@v5
        if: steps.filter.outputs.jetbrains == 'true'

      - name: Setup Node.js
        if: steps.filter.outputs.jetbrains == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install deps
        if: steps.filter.outputs.jetbrains == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build agent-sdk dist
        if: steps.filter.outputs.jetbrains == 'true'
        run: pnpm -F wave-agent-sdk build

      - name: Build webview dist
        if: steps.filter.outputs.jetbrains == 'true'
        run: pnpm -F wave-webview run compile -- --production

      - name: Build wave-code dist
        if: steps.filter.outputs.jetbrains == 'true'
        run: pnpm -F wave-code build

      - name: Run tests
        if: steps.filter.outputs.jetbrains == 'true'
        run: ./packages/jetbrains/gradlew -p packages/jetbrains test --no-daemon
