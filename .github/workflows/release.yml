name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # Required for npm OIDC provenance

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-tags: true

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Cache ripgrep binaries
        uses: actions/cache@v6
        with:
          path: packages/agent-sdk/vendor/ripgrep
          key: ripgrep-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            ripgrep-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # --- npm publish ---
      - name: Publish to npm
        run: pnpm -r publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # --- VS Code extension (.vsix) ---
      - name: Package .vsix
        run: pnpm -F wave-vsce run package

      # --- Docs (docs.tar.gz) ---
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm -F wave-webview exec playwright install --with-deps chromium

      - name: Generate screenshots
        run: pnpm -F wave-webview run test:demo

      - name: Build docs with base /docs/
        env:
          # CodeChat embeds these docs and hides the GitHub Releases download link;
          # only the Release artifact gets this flag, GitHub Pages keeps the link.
          DOCS_HIDE_DOWNLOAD: '1'
        run: npx vitepress build docs --base /docs/

      - name: Package docs.tar.gz
        run: tar -czf docs.tar.gz -C docs/.vitepress/dist .

      # --- GitHub Release ---
      - name: Get previous tag
        id: prev-tag
        run: |
          PREV_TAG=$(git tag --sort=-v:refname --list 'v*' | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          echo "tag=${PREV_TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            packages/vsce/releases/*.vsix
            docs.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          previous_tag: ${{ steps.prev-tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
