name: Deploy VitePress to GitHub Pages

# docs:build runs `pnpm run docs:screenshots && vitepress build docs`, so the demo
# suites (packages/webview/demo/*.demo.ts) execute **only here** — they are no longer
# duplicated as a PR job in ci.yml. They exist to produce the screenshots the docs
# import (docs/public/screenshots/ is a gitignored build artifact), and that is the
# only place they can run: there is nothing else to run them for.
#
# Because that makes this the sole gate on the demo layer, the trigger list has to
# cover everything a demo renders — including packages/webview/src/**. Everywhere
# else in CI, `!packages/webview/demo/**` is filtered out; here it must select.
# A webview source change therefore redeploys the docs site on merge, which is what
# surfaces a broken demo (rather than waiting for someone to touch docs/**).
#
# It used to also run in the release publish.yml (which attached a
# docs-<version>.tar.gz to the GitHub Release); that platform archive is now packed
# locally with `pnpm run docs:pack`, like the remote-control page's `pack:remote`,
# so a release builds neither. Keeping the build only at release time let two
# v1.2.0 failures (the demo mock host not answering the worktree-diff check, and raw
# angle-bracket placeholders breaking VitePress) stay invisible until the release.
# Auto-trigger on push to main surfaces such failures early; workflow_dispatch is
# kept for manual re-runs. The e2e project the demos used to run alongside is
# covered post-merge by the webview-e2e job (e2e/utils/** and e2e/fixtures/** still
# feed the demos, hence the path trigger).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/webview/src/**"
      - "packages/webview/demo/**"
      - "packages/webview/e2e/**"
      - "packages/webview/esbuild.config.mjs"
      - "packages/webview-fixtures/**"
      - "packages/vscode/LOGO.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm -F wave-webview exec playwright install --with-deps chromium

      - name: Build agent-sdk
        run: pnpm -F wave-agent-sdk build

      - name: Build webview-fixtures
        run: pnpm -F wave-webview-fixtures build

      - name: Build VitePress
        run: pnpm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
