name: CI (Windows)

# Non-blocking Windows compatibility check.
# Runs after PRs merge to main (push), like the docs deploy workflow — it does
# NOT gate PRs, so Windows runner minutes are only spent on merged changes that
# touch platform-specific code paths (subprocess spawning, fs, .cmd/.exe
# resolution). workflow_dispatch remains for manual runs from the Actions tab.
# NOT a required check: configure in repo Settings → Branches → main
# protection rule to keep only the Linux `check` job as required.

on:
  push:
    branches: [main]
    paths:
      - "packages/agent-sdk/**"
      - "packages/code/**"
      - "packages/vscode/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/ci-windows.yml"
  workflow_dispatch:

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Cache pnpm/action-setup's install dir so jobs skip re-downloading the
      # action tarball from codeload (429 rate limits, pnpm/action-setup#177).
      # On hit we skip the action and prepend its bin dirs to PATH ourselves.
      # The key pins the pnpm version — keep it in sync with the `version`
      # input below (package.json "packageManager").
      - name: Cache pnpm install
        id: pnpm-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/setup-pnpm
          key: pnpm-setup-v5-${{ runner.os }}-${{ runner.arch }}-11.9.0

      - name: Add cached pnpm to PATH
        if: steps.pnpm-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          # Mirror pnpm/action-setup's env: node_modules/.bin/bin holds the
          # self-updated target version (higher precedence), node_modules/.bin
          # the bootstrap symlink. GITHUB_PATH is used verbatim, so write
          # native Windows paths on Windows runners.
          PNPM_HOME="${USERPROFILE:-$HOME}/.cache/setup-pnpm/node_modules/.bin"
          PNPM_BIN="$PNPM_HOME/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PNPM_HOME="${PNPM_HOME//\//\\}"
            PNPM_BIN="${PNPM_BIN//\//\\}"
          fi
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          echo "$PNPM_BIN" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"

      - name: Setup pnpm (cache miss)
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 11.9.0
          dest: ~/.cache/setup-pnpm
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Run tests WITHOUT coverage, type-check, or lint on Windows.
      # - Coverage: the v8 provider crashes silently on Windows (process exits
      #   right after "Coverage enabled with v8" with no output); already
      #   enforced by the blocking Linux CI.
      # - Type-check & lint: platform-agnostic (identical result on Linux), and
      #   already enforced by the blocking Linux CI. Skipping them here saves
      #   ~40s of redundant work — the only purpose of this Windows workflow is
      #   to verify the tests themselves pass cross-platform.
      #
      # Tests are invoked per-package via `pnpm --filter <pkg> exec vitest run`
      # rather than `pnpm -r test`. The latter runs each package's `test`
      # script (which uses `--reporter=dot`); under pnpm's child-process
      # management on Windows the dot reporter's stdout buffering causes the
      # agent-sdk vitest process to crash silently right after emitting "RUN".
      # Calling `vitest run` directly (default reporter) is the invocation
      # pattern proven to run all agent-sdk tests green on Windows.
      #
      # Only packages with platform-specific code paths (subprocess spawning,
      # fs, .cmd/.exe resolution) are run here — these are the paths that can
      # actually regress on Windows. wave-webview is omitted: its 43 tests are
      # pure React/jsdom component + reducer logic with no OS contact (no
      # process.platform / fs / child_process anywhere in tests/ or src/),
      # so they produce identical results on Linux and are already covered by
      # the blocking Linux `check` job. Skipping them saves ~48s (~30% of the
      # remaining test time).
      - name: Tests
        run: |
          pnpm --filter wave-agent-sdk exec vitest run &&
          pnpm --filter wave-code exec vitest run &&
          pnpm --filter wave-vscode exec vitest run
