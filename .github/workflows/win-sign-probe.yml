name: Windows Sign Probe (temp)

# 临时探针 v2：逐项探测签名的每个 HTTP 端点，记录状态码。
# v1 发现 ssigncode.latest.exe 从 GitHub runner 返回 403（内网访问是 302→200），
# 本轮直连 2.3 版本的实际文件地址，并顺带验证 token 接口。
# 跑完即可删除本文件。触发方式：推送到 test/ci-sign-probe 分支。

on:
  push:
    branches: [test/ci-sign-probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: 1. Runner 与出口 IP
        shell: pwsh
        run: |
          Write-Host "OS: $((Get-CimInstance Win32_OperatingSystem).Caption)"
          Write-Host "Runner 出口 IP:"
          try {
            $ips = Invoke-RestMethod -Uri 'https://api.ipify.org?format=json' -TimeoutSec 15
            Write-Host "  $($ips.ip)"
          } catch { Write-Host "  ipify failed: $_" }

      - name: 2. 各端点 HTTP 状态码
        shell: pwsh
        run: |
          $probes = @(
            @{ m = 'GET'; u = 'https://rcss.nie.netease.com/' },
            @{ m = 'GET'; u = 'https://rcss.nie.netease.com/ssigncode/' },
            @{ m = 'GET'; u = 'https://rcss.nie.netease.com/ssigncode/ssigncode.latest.exe' },
            @{ m = 'GET'; u = 'https://rcss.nie.netease.com/ssigncode/apps/ssigncode.2.3.exe' },
            @{ m = 'GET'; u = 'https://fcy-auth.nie.netease.com/' },
            @{ m = 'GET'; u = 'http://timestamp.rcss.nie.netease.com/' }
          )
          foreach ($p in $probes) {
            $out = & curl.exe -s -o NUL -m 25 -w "%{http_code} %{size_download} %{remote_ip} %{redirect_url}" $p.u 2>&1
            Write-Host ("{0,-4} {1,-70} -> {2}" -f $p.m, $p.u, $out)
          }

      - name: 3. Auth Key 换 token（POST）
        shell: pwsh
        env:
          SSIGN_AUTH_KEY: ${{ secrets.SSIGN_AUTH_KEY }}
        run: |
          if (-not $env:SSIGN_AUTH_KEY) { throw 'secret SSIGN_AUTH_KEY 为空' }
          $bodyFile = Join-Path $env:RUNNER_TEMP 'token-body.json'
          $body = @{ user = 'liuyiqi02'; key = $env:SSIGN_AUTH_KEY } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText($bodyFile, $body, (New-Object Text.UTF8Encoding($false)))
          $respFile = Join-Path $env:RUNNER_TEMP 'token-resp.json'
          $out = & curl.exe -s -o $respFile -m 40 -w "%{http_code}" -X POST `
            -H 'Content-Type: application/json' --data-binary "@$bodyFile" `
            'https://fcy-auth.nie.netease.com/api/v2/tokens' 2>&1
          Write-Host "POST /api/v2/tokens -> HTTP $out"
          Remove-Item $bodyFile -Force -ErrorAction SilentlyContinue
          if (Test-Path $respFile) {
            $raw = Get-Content $respFile -Raw -ErrorAction SilentlyContinue
            # 只打印结构，不打印 token 值
            try {
              $j = $raw | ConvertFrom-Json
              $hasToken = [bool]$j.token
              Write-Host "  响应字段: $($j.PSObject.Properties.Name -join ', ')"
              Write-Host "  含 token: $hasToken"
              if ($hasToken) {
                $p = $j.token.Split('.')
                $b64 = $p[1].Replace('-', '+').Replace('_', '/')
                switch ($b64.Length % 4) { 2 { $b64 += '==' } 3 { $b64 += '=' } }
                $claims = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($b64)) | ConvertFrom-Json
                Write-Host "  claims.user = $($claims.user)"
                Write-Host "  claims.exp  = $([DateTimeOffset]::FromUnixTimeSeconds([int64]$claims.exp).ToLocalTime())"
                $dir = Join-Path $env:APPDATA 'ssigncode'
                New-Item -ItemType Directory -Force -Path $dir | Out-Null
                [IO.File]::WriteAllText((Join-Path $dir 'authtoken'), $j.token, [Text.Encoding]::ASCII)
                Write-Host "  已写入 authtoken"
              }
            } catch {
              Write-Host "  非 JSON 响应（前 200 字符）: $($raw.Substring(0, [Math]::Min(200, $raw.Length)))"
            }
            Remove-Item $respFile -Force -ErrorAction SilentlyContinue
          }

      - name: 4. 若能下载，就完成一次真实签名
        shell: pwsh
        run: |
          $dir = Join-Path $env:APPDATA 'ssigncode'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $dir 'ssigncode.exe'
          $candidates = @(
            'https://rcss.nie.netease.com/ssigncode/apps/ssigncode.2.3.exe',
            'https://rcss.nie.netease.com/ssigncode/ssigncode.latest.exe'
          )
          $got = $false
          foreach ($u in $candidates) {
            & curl.exe -sL -o $exe -m 90 -w "download $u -> %{http_code} (%{size_download} bytes)`n" $u
            if ((Test-Path $exe) -and ((Get-Item $exe).Length -gt 100000)) { $got = $true; break }
          }
          if (-not $got) { Write-Host '::error::下载 ssigncode 失败，签名链路不通'; exit 1 }
          $sha = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "sha256 = $sha"
          if ($sha -ne 'dd83df4a4ccf7ffb7166cd3778a0d6521bf67ece794c57f656d6f5900884f018') {
            Write-Host '::warning::hash 与已知 2.3 不同（工具滚动升级，通常正常）'
          }

          $tokenFile = Join-Path $dir 'authtoken'
          if (-not (Test-Path $tokenFile)) { Write-Host '::error::没有 authtoken（上一步换 token 失败），跳过签名'; exit 1 }

          $work = Join-Path $env:RUNNER_TEMP 'signwork'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $target = Join-Path $work 'probe.exe'
          Copy-Item "$env:SystemRoot\System32\notepad.exe" $target -Force
          Write-Host "待签文件：$target ($((Get-Item $target).Length) bytes)"

          $cmd = 'chcp 936 >nul & "' + $exe + '" -c -t ev2024 -f "' + $target + '"'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          Push-Location $work
          try { & cmd.exe /c $cmd | Write-Host } finally { Pop-Location }
          $code = $LASTEXITCODE
          $sw.Stop()
          Write-Host ("ssigncode 退出码 = {0}，耗时 {1:N1}s" -f $code, $sw.Elapsed.TotalSeconds)

          if (Test-Path (Join-Path $work 'done-fail')) {
            $msg = Get-Content (Join-Path $work 'done-fail') -Raw -Encoding Default
            Write-Host "::error::签名失败：$msg"
          }
          if ($code -ne 0) { throw "ssigncode 退出码 $code" }

          $sig = Get-AuthenticodeSignature -LiteralPath $target
          Write-Host "Status      : $($sig.Status)"
          Write-Host "Signer      : $($sig.SignerCertificate.Subject)"
          Write-Host "Timestamped : $($sig.TimeStamperCertificate -ne $null)"
          if ($sig.Status -ne 'Valid') { throw "验签未通过：$($sig.Status) $($sig.StatusMessage)" }
          Write-Host "`n=== 结论：GitHub 托管 runner 完成 ssigncode 签名成功 ==="

      - name: 5. 上传签名产物（留证）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-probe
          path: ${{ runner.temp }}/signwork/probe.exe
          if-no-files-found: warn
