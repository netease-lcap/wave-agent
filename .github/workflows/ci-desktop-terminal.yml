name: CI (Desktop Terminal)

# FR-046: node-pty native module must work on the release platforms. Runs the
# real-PTY smoke test (no mocks) on macOS + Windows — the Linux blocking CI
# never executes desktop tests (no test:coverage script there), so this matrix
# is the CI proof that the terminal panel's backend loads and spawns
# cross-platform. Triggered on PRs that touch desktop/terminal code or the
# lockfile, and manually.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/desktop/**'
      - 'packages/webview/src/components/TerminalPane.tsx'
      - 'packages/webview/src/terminal-entry.ts'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

concurrency:
  group: ci-desktop-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm strips the exec bit from node-pty's prebuilt spawn-helper
      # (prebuilds/darwin-*/spawn-helper), which makes pty.spawn() fail with
      # "posix_spawnp failed". Windows has no exec bit so this is macOS-only.
      - name: Restore node-pty spawn-helper exec bit
        if: runner.os == 'macOS'
        run: chmod +x node_modules/.pnpm/node-pty@*/node_modules/node-pty/prebuilds/darwin-*/spawn-helper

      - name: node-pty smoke test
        run: pnpm --filter wave-desktop exec vitest run tests/terminalPty.smoke.test.ts
